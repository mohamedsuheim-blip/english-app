<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تعلّم الإنجليزي</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mut:#667085;--pri:#2563eb;--ok:#16a34a;--bad:#dc2626;--bd:#e4e7ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131a;--card:#1a1f2b;--tx:#eef1f7;--mut:#9aa4b5;--pri:#5b8cff;--ok:#34d27b;--bad:#ff6b6b;--bd:#2a3140}}
:root[data-theme="dark"]{--bg:#10131a;--card:#1a1f2b;--tx:#eef1f7;--mut:#9aa4b5;--pri:#5b8cff;--ok:#34d27b;--bad:#ff6b6b;--bd:#2a3140}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0}h2{font-size:19px;text-align:center;margin:14px 0}
.mut{color:var(--mut);font-size:14px;line-height:1.7}
.list{display:grid;gap:10px;margin:14px 0}
button{font:inherit;color:inherit;cursor:pointer}
.lv{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;text-align:start;width:100%}
.lv b{background:var(--pri);color:#fff;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;flex:none}
.lv span{flex:1;font-size:16px}.lv em{font-style:normal;color:var(--mut);font-size:14px}
.lv.lock{opacity:.5}.lv.lock b{background:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px 14px;text-align:center;margin:12px 0}
.big{font-size:60px;font-weight:700;line-height:1.2;margin:6px 0}
.mid{font-size:26px;font-weight:700;line-height:1.5;margin:6px 0}
.sub{font-size:20px;color:var(--mut);margin:8px 0}
.snd{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:10px 18px;margin:8px 0;font-size:16px}
.row{display:flex;gap:10px;margin:10px 0}.row button{flex:1}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:14px;font-size:17px;width:100%}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.ghost{background:none;border:0;font-size:20px;padding:4px 8px;color:var(--mut)}
.top{display:flex;align-items:center;gap:10px}.bar{flex:1;height:8px;background:var(--bd);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.opt{display:block;width:100%;background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:14px;margin:8px 0;font-size:19px;text-align:center}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
input{width:100%;font:inherit;font-size:22px;text-align:center;padding:14px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);direction:ltr;margin:8px 0}
input.good{border-color:var(--ok)}
.fb{border-radius:14px;padding:12px;margin:10px 0;text-align:center;font-size:18px}
.fb.ok{background:color-mix(in srgb,var(--ok) 20%,var(--card))}.fb.bad{background:color-mix(in srgb,var(--bad) 20%,var(--card))}
.score{font-size:56px;font-weight:700;text-align:center;margin:10px 0}
.wr{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:6px 0;direction:ltr;text-align:left}
</style>
</head>
<body>
<div id="app"></div>
<script>
const PASS=80;
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const nz=s=>String(s).toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();
let prog={};try{prog=JSON.parse(localStorage.getItem("eng1")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("eng1",JSON.stringify(prog))}catch(e){}};
function say(t){try{if(window.Android){Android.speak(t);return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.8;speechSynthesis.speak(u)}catch(e){}}

const LET=[["A","ay","إيه","Apple","تفاحة"],["B","bee","بي","Ball","كورة"],["C","see","سي","Cat","قطة"],["D","dee","دي","Dog","كلب"],["E","ee","إي","Egg","بيضة"],["F","eff","إف","Fish","سمكة"],["G","jee","جي","Girl","بنت"],["H","aitch","إتش","Hat","قبعة"],["I","eye","آي","Ice","تلج"],["J","jay","جاي","Juice","عصير"],["K","kay","كاي","Key","مفتاح"],["L","el","إل","Lion","أسد"],["M","em","إم","Milk","لبن"],["N","en","إن","Nose","مناخير"],["O","oh","أو","Orange","برتقانة"],["P","pee","پي","Pen","قلم"],["Q","queue","كيو","Queen","ملكة"],["R","are","آر","Rice","رز"],["S","ess","إس","Sun","شمس"],["T","tee","تي","Tree","شجرة"],["U","you","يو","Umbrella","شمسية"],["V","vee","في","Van","عربية نقل"],["W","double you","دابليو","Water","مية"],["X","ex","إكس","X-ray","أشعة"],["Y","why","واي","Yellow","أصفر"],["Z","zed","زد","Zoo","حديقة حيوان"]];
const G=[[0,5],[5,10],[10,15],[15,20],[20,26]];
const LV=G.map(([a,b])=>({t:"الحروف: "+LET[a][0]+" إلى "+LET[b-1][0],k:"l",it:LET.slice(a,b).map(x=>({en:x[0],say:x[1],ar:x[2],w:x[3],wa:x[4]}))}));
const mk=(t,k,s)=>LV.push({t,k,it:s.split(";").map(x=>{const p=x.split("|");return{en:p[0],ar:p[1],rp:p[2],ra:p[3]}})});
mk("كلمات: التحية والأساسيات","w","Hello|أهلاً;Yes|نعم;No|لا;Thank you|شكراً;Please|من فضلك;Sorry|آسف;Goodbye|مع السلامة;Good|كويس");
mk("كلمات: العيلة","w","Father|أب;Mother|أم;Brother|أخ;Sister|أخت;Son|ابن;Daughter|بنت;Friend|صاحب;Baby|طفل");
mk("كلمات: الأرقام","w","One|واحد;Two|اتنين;Three|تلاتة;Four|أربعة;Five|خمسة;Six|ستة;Seven|سبعة;Eight|تمانية;Nine|تسعة;Ten|عشرة");
mk("كلمات: أفعال يومية","w","Eat|ياكل;Drink|يشرب;Sleep|ينام;Go|يروح;Come|يجي;Read|يقرأ;Write|يكتب;Listen|يسمع");
mk("كلمات: ألوان وأشياء","w","Red|أحمر;Blue|أزرق;Green|أخضر;Black|أسود;White|أبيض;Book|كتاب;House|بيت;Car|عربية");
mk("جمل بسيطة","s","I am happy|أنا سعيد;I like tea|أنا بحب الشاي;This is my book|ده كتابي;Where is the house|فين البيت;What is your name|اسمك إيه;My name is Ali|اسمي علي;How are you|عامل إيه;I am fine|أنا كويس");
mk("كلمات: أكل وشرب","w","Water|مية;Bread|عيش;Rice|رز;Meat|لحمة;Chicken|فراخ;Fish|سمك;Milk|لبن;Coffee|قهوة;Tea|شاي;Fruit|فاكهة");
mk("كلمات: أماكن","w","School|مدرسة;Hospital|مستشفى;Market|سوق;Street|شارع;City|مدينة;Airport|مطار;Hotel|فندق;Restaurant|مطعم;Bank|بنك;Shop|محل");
mk("كلمات: الوقت والأيام","w","Today|النهارده;Tomorrow|بكرة;Yesterday|امبارح;Morning|الصبح;Night|الليل;Week|أسبوع;Month|شهر;Year|سنة;Monday|الاثنين;Friday|الجمعة");
mk("كلمات: صفات","w","Big|كبير;Small|صغير;Hot|سخن;Cold|بارد;New|جديد;Old|قديم;Fast|سريع;Slow|بطيء;Easy|سهل;Difficult|صعب");
mk("كلمات: الجسم والصحة","w","Head|راس;Eye|عين;Hand|إيد;Leg|رجل;Heart|قلب;Doctor|دكتور;Medicine|دوا;Pain|وجع;Sick|مريض;Healthy|صحي");
mk("كلمات: الشغل والفلوس","w","Work|شغل;Money|فلوس;Price|سعر;Job|وظيفة;Boss|مدير;Office|مكتب;Meeting|اجتماع;Salary|مرتب;Buy|يشتري;Sell|يبيع");
mk("جمل: التعارف","s","Nice to meet you|اتشرفت بيك;I am from Egypt|أنا من مصر;I live in Cairo|أنا ساكن في القاهرة;I speak a little English|أنا بتكلم إنجليزي شوية;Where are you from|إنت منين;How old are you|عندك كام سنة;I am a student|أنا طالب;What do you do|بتشتغل إيه");
mk("جمل: في المطعم","s","I would like a coffee|عايز قهوة لو سمحت;Can I see the menu|ممكن أشوف المنيو;The bill please|الحساب لو سمحت;I am hungry|أنا جعان;I am thirsty|أنا عطشان;It is delicious|ده لذيذ;Do you have water|عندكم مية;No sugar please|من غير سكر لو سمحت");
mk("جمل: الشارع والمواصلات","s","Where is the bank|فين البنك;How much is this|ده بكام;Turn left|لف شمال;Turn right|لف يمين;Go straight|امشي على طول;I am lost|أنا تهت;How far is it|المكان ده بعيد قد إيه;Stop here please|وقف هنا لو سمحت");
mk("جمل: لو مش فاهم","s","Can you repeat that|ممكن تعيد تاني;Speak slowly please|اتكلم ببطء لو سمحت;I do not understand|أنا مش فاهم;What does this mean|ده معناه إيه;How do you say this in English|تقولها إزاي بالإنجليزي;I do not know|أنا معرفش;Can you help me|ممكن تساعدني;Sorry I did not hear you|آسف مسمعتش");
mk("محادثة: تحية وتعارف","d","How are you|عامل إيه|I am fine thank you|أنا كويس شكراً;What is your name|اسمك إيه|My name is Ali|اسمي علي;Where are you from|إنت منين|I am from Egypt|أنا من مصر;Nice to meet you|اتشرفت بيك|Nice to meet you too|وأنا كمان اتشرفت بيك;Do you speak English|بتتكلم إنجليزي|A little|شوية;Good morning|صباح الخير|Good morning to you|صباح النور عليك;Thank you very much|شكراً جزيلاً|You are welcome|العفو;See you tomorrow|أشوفك بكرة|Goodbye see you|مع السلامة نشوفك");
mk("محادثة: مطعم ومحلات","d","What would you like|تحب تطلب إيه|I would like a coffee please|عايز قهوة لو سمحت;Anything else|أي حاجة تانية|No that is all thank you|لا كده تمام شكراً;Can I help you|أقدر أساعدك|Yes I am looking for a shirt|أيوه أنا بدور على قميص;It is twenty dollars|سعره عشرين دولار|That is too expensive|ده غالي أوي;Cash or card|كاش ولا كارت|Card please|كارت لو سمحت;Here is your change|الباقي بتاعك|Thank you|شكراً;How was the food|الأكل كان عامل إزاي|It was delicious|كان لذيذ;Would you like some water|تحب مية|Yes please|أيوه لو سمحت");
mk("محادثة: أسئلة واتجاهات","d","Do you need help|محتاج مساعدة|Yes where is the station|أيوه فين المحطة;Go straight and turn left|امشي على طول وبعدين شمال|Thank you very much|شكراً جزيلاً;Is it far|هو بعيد|No it is five minutes|لا ده خمس دقايق;Excuse me|لو سمحت|Yes how can I help|أيوه أقدر أساعدك إزاي;Do you understand|فاهم|Sorry can you repeat|آسف ممكن تعيد;What time is it|الساعة كام|It is three o clock|الساعة تلاتة;Are you lost|إنت تايه|Yes I need help|أيوه محتاج مساعدة;Where do you live|ساكن فين|I live in Cairo|أنا ساكن في القاهرة");

function opts(c,near,far){let o=pick(near.filter(x=>x!==c),3);if(o.length<3)o=o.concat(pick(far.filter(x=>x!==c&&!o.includes(x)),3-o.length));return shuffle([...o,c])}
function build(li){
 const v=LV[li],P=LV.filter(x=>x.k==v.k).flatMap(x=>x.it),q=[];
 v.it.forEach(x=>{
  const O=f=>opts(x[f],v.it.map(y=>y[f]),P.map(y=>y[f])),r=x.en+" = "+x.ar;
  if(v.k=="l"){
   q.push({p:"اسمع واختار الحرف",sp:x.say,o:O("en"),a:x.en,r});
   q.push({p:"إيه اسم الحرف ده؟",show:x.en+" "+x.en.toLowerCase(),o:O("ar"),a:x.ar,r});
   q.push({p:"اسمع واكتب الحرف بالإنجليزي",sp:x.say,type:1,a:x.en,r});
   q.push({p:"الكلمة دي بتبدأ بأنهي حرف؟",show:x.w+" ("+x.wa+")",sp:x.w,o:O("en"),a:x.en,r});
  }else{
   if(v.k=="d"){
    const r2=x.en+" ← "+x.rp;
    q.push({p:"اسمع واختار الرد المناسب",sp:x.en,o:O("rp"),a:x.rp,r:r2});
    q.push({p:"إيه الرد المناسب؟",show:x.en,sp:x.en,o:O("rp"),a:x.rp,r:r2});
    q.push({p:"إيه معنى اللي سمعته؟",sp:x.en,o:O("ar"),a:x.ar,r:r2});
    q.push({p:"اكتب الرد المناسب بالإنجليزي",show:x.en,sp:x.en,type:1,a:x.rp,r:r2});
    q.push({p:"إيه معنى الرد ده؟",show:x.rp,sp:x.rp,o:O("ra"),a:x.ra,r:r2});
    return;
   }
   q.push({p:"اسمع واختار اللي سمعته",sp:x.en,o:O("en"),a:x.en,r});
   q.push({p:"إيه معنى ده بالعربي؟",show:x.en,sp:x.en,o:O("ar"),a:x.ar,r});
   q.push({p:"ترجم للإنجليزي",show:x.ar,o:O("en"),a:x.en,r});
   q.push({p:"اكتب بالإنجليزي",show:x.ar,type:1,a:x.en,r});
   q.push({p:"اسمع واكتب اللي سمعته",sp:x.en,type:1,a:x.en,r});
  }
 });
 return pick(q,10);
}

let Q={},cur="";
function home(){
 const d=LV.filter((_,i)=>(prog[i]||0)>=PASS).length;
 app.innerHTML=`<h1>تعلّم الإنجليزي 🔤</h1><p class="mut">خلّصت ${d} من ${LV.length} مستوى. لازم تجيب ${PASS}% في الاختبار عشان يتفتح المستوى اللي بعده، ولو النتيجة معجبتكش تقدر تعيد الاختبار براحتك.</p><div class="list">`+
 LV.map((v,i)=>{const open=i==0||(prog[i-1]||0)>=PASS,b=prog[i];return `<button class="lv ${open?"":"lock"}" ${open?`onclick="lesson(${i},0)"`:"disabled"}><b>${i+1}</b><span>${v.t}</span><em>${open?(b==null?"جديد":b+"%"+(b>=PASS?" ✓":"")):"🔒"}</em></button>`}).join("")+
 `</div><p class="mut">الصوت بيشتغل من نطق تليفونك. لو مفيش صوت، نزّل Speech Services by Google وفعّل اللغة الإنجليزية.</p><button class="btn sec" onclick="reset()">مسح كل التقدم</button>`;
}
function reset(){if(confirm("متأكد إنك عايز تمسح كل التقدم؟")){prog={};save();home()}}
function lesson(li,k){
 const v=LV[li],x=v.it[k],last=k==v.it.length-1;
 const c=v.k=="d"?`<div class="sub">هو بيقول:</div><div class="mid" dir="ltr">${x.en}</div><button class="snd" onclick="say('${x.en}')">🔊 اسمع</button><div class="sub">${x.ar}</div><div class="sub">وإنت ترد:</div><div class="mid" dir="ltr">${x.rp}</div><button class="snd" onclick="say('${x.rp}')">🔊 اسمع الرد</button><div class="sub">${x.ra}</div>`:v.k=="l"?
  `<div class="big" dir="ltr">${x.en} ${x.en.toLowerCase()}</div><div class="sub">اسمه: ${x.ar}</div><button class="snd" onclick="say('${x.say}')">🔊 اسمع الحرف</button><div class="mid" dir="ltr">${x.w} <button class="snd" onclick="say('${x.w}')">🔊</button></div><div class="sub">${x.wa}</div>`:
  `<div class="${v.k=="s"?"mid":"big"}" dir="ltr">${x.en}</div><button class="snd" onclick="say('${x.en}')">🔊 اسمع</button><div class="sub">${x.ar}</div>`;
 cur=v.k=="d"?x.rp:x.en;
 app.innerHTML=`<div class="top"><button class="ghost" onclick="home()">✕</button><div class="bar"><i style="width:${(k+1)/v.it.length*100}%"></i></div><span>${k+1}/${v.it.length}</span></div><h2>${v.t}</h2><div class="card">${c}</div><p class="mut" style="text-align:center">جرّب تكتبها بنفسك:</p><input id="pr" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" oninput="this.className=nz(this.value)==nz(cur)?'good':''"><div class="row">${k>0?`<button class="btn sec" onclick="lesson(${li},${k-1})">السابق</button>`:""}${last?`<button class="btn" onclick="start(${li})">ابدأ الاختبار</button>`:`<button class="btn" onclick="lesson(${li},${k+1})">التالي</button>`}</div>`;
 say(x.say||x.en);
}
function start(li){Q={li,qs:build(li),i:0,s:0,w:[]};ask()}
function ask(){
 const q=Q.qs[Q.i],n=Q.qs.length;
 app.innerHTML=`<div class="top"><button class="ghost" onclick="home()">✕</button><div class="bar"><i style="width:${Q.i/n*100}%"></i></div><span>${Q.i+1}/${n}</span></div><h2>${q.p}</h2>`+
 (q.show||q.sp?`<div class="card">${q.show?`<div class="${q.show.length>12?"mid":"big"}" dir="auto">${esc(q.show)}</div>`:""}${q.sp?`<button class="snd" onclick="say(Q.qs[Q.i].sp)">🔊 اسمع</button>`:""}</div>`:"")+
 (q.type?`<input id="ti" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key==='Enter')sub()"><button class="btn" onclick="sub()">تأكيد</button>`:q.o.map((o,i)=>`<button class="opt" dir="auto" onclick="pickO(${i})">${esc(o)}</button>`).join(""))+`<div id="fb"></div>`;
 if(q.sp)say(q.sp);
 if(q.type)$("#ti").focus();
}
function pickO(i){const q=Q.qs[Q.i],g=q.o[i];document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(q.o[j]===q.a)b.classList.add("ok");else if(j==i)b.classList.add("bad")});judge(g===q.a)}
function sub(){const t=$("#ti");if(!t.value.trim())return;t.disabled=true;judge(nz(t.value)==nz(Q.qs[Q.i].a))}
function judge(ok){
 const q=Q.qs[Q.i];if(ok)Q.s++;else Q.w.push(q);
 const last=Q.i==Q.qs.length-1;
 $("#fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}">${ok?"✓ صح، برافو!":"✗ غلط. الإجابة الصح: <b dir='auto'>"+esc(q.a)+"</b>"}</div><button class="btn" onclick="${last?"fin()":"Q.i++;ask()"}">${last?"شوف النتيجة":"التالي"}</button>`;
 $("#fb").scrollIntoView({block:"end"});
}
function fin(){
 const p=Math.round(Q.s/Q.qs.length*100),li=Q.li,pass=p>=PASS,nx=pass&&li<LV.length-1;
 prog[li]=Math.max(prog[li]||0,p);save();
 app.innerHTML=`<h2>${LV[li].t}</h2><div class="score" style="color:var(--${pass?"ok":"bad"})">${p}%</div><p class="mut" style="text-align:center;font-size:17px">${pass?"نجحت! 🎉 "+(nx?"المستوى اللي بعده اتفتح.":"خلّصت كل المستويات المتاحة."):"محتاج "+PASS+"% عشان تنجح. راجع الدرس وجرّب تاني."}</p>`+
 (Q.w.length?`<p class="mut">اللي غلطت فيه:</p>`+Q.w.map(q=>`<div class="wr">${esc(q.r)}</div>`).join(""):"")+
